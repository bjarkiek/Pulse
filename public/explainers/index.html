<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse explainers</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/SpaceGrotesk-500.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/SpaceGrotesk-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("assets/IBMPlexSans-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("assets/IBMPlexSans-600.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 700; src: url("assets/IBMPlexSans-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/IBMPlexMono-400.woff2") format("woff2"); }
:root {
  --page: #fafafa; --card: #fff; --ink: #171717; --body: #404040; --muted: #737373;
  --border: #e5e5e5; --border-strong: #d4d4d4; --tint: #f5f5f5;
  --head: "Space Grotesk", sans-serif; --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.bar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--border); }
.bar img { height: 22px; display: block; }
.bar .sep { width: 1px; height: 22px; background: var(--border-strong); }
.bar .prod { font-family: var(--head); font-weight: 500; font-size: 17px; color: var(--body); }
.bar .now { font-family: var(--head); font-weight: 700; font-size: 16px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-family: var(--head); font-weight: 500; font-size: 15px; cursor: pointer; text-decoration: none; transition: background-color .15s ease-out; }
.btn:hover { background: #404040; border-color: #404040; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--border-strong); }
.btn.ghost:hover { background: var(--tint); border-color: var(--border-strong); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

main { max-width: 1240px; margin: 0 auto; padding: 56px 24px 72px; }
.eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--head); font-weight: 700; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.1; letter-spacing: -0.01em; margin-top: 10px; }
.lead { font-size: 18px; color: var(--body); margin-top: 14px; max-width: 640px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 40px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 8px rgba(23,23,23,.06); display: flex; flex-direction: column; overflow: hidden; }
.card figure { background: var(--tint); border-bottom: 1px solid var(--border); padding: 20px; }
.card figure svg { display: block; width: 100%; height: auto; }
.card .in { padding: 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h2 { font-family: var(--head); font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; }
.card p { color: var(--body); }
.meta { font-size: 14px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: auto; padding-top: 14px; }
.link { font-family: var(--mono); font-size: 13px; color: var(--body); text-underline-offset: 3px; word-break: break-all; }
.link:hover { color: var(--ink); }

/* infographic parts */
.ig text { font-family: "IBM Plex Sans", sans-serif; font-size: 13px; fill: #404040; }
.ig .n { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 15px; fill: #fff; }
.ig .t { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 14px; fill: #171717; }
.ig .box { fill: #fff; stroke: #e5e5e5; }
.ig .ln { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
.ig .dot { fill: #171717; }

/* viewer */
#viewer { position: fixed; inset: 0; display: none; flex-direction: column; background: #0a0a0a; }
#viewer iframe { flex: 1; width: 100%; border: 0; background: #0a0a0a; }
body.viewing #viewer { display: flex; }
body.viewing #list { display: none; }
</style>
</head>
<body>

<div id="list">
  <header class="bar">
    <img src="assets/datacentral-blacktext.svg" alt="DataCentral"><span class="sep"></span><span class="prod">Pulse</span>
  </header>
  <main>
    <div class="eyebrow">Explainers</div>
    <h1>How Pulse works, by audience</h1>
    <p class="lead">Three one-minute cuts. Each one is silent, captioned and loops.</p>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="viewer">
  <header class="bar">
    <button class="btn ghost" id="back" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back
    </button>
    <span class="sep"></span><span class="prod">Pulse</span>
    <span class="now" id="now"></span>
  </header>
  <iframe id="frame" title="Pulse explainer" allow="fullscreen"></iframe>
</div>

<script>
const arrowDefs = `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#a3a3a3" stroke-width="1.5"/></marker></defs>`;

// A closed loop of five numbered steps.
const loop = (steps) => {
  const cx = 180, cy = 110, rx = 92, ry = 72;
  const pts = steps.map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / steps.length; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  return `<svg class="ig" viewBox="0 0 360 220" role="img" aria-label="${steps.join(", then ")}, in a loop">
    <ellipse class="ln" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" stroke-dasharray="4 5"/>
    ${pts.map(([x, y], i) => `<circle class="dot" cx="${x}" cy="${y}" r="15"/><text class="n" x="${x}" y="${y + 5}" text-anchor="middle">${i + 1}</text>
      <text class="t" x="${x + (x < cx - 5 ? -22 : x > cx + 5 ? 22 : 0)}" y="${y + (Math.abs(x - cx) <= 5 ? -24 : 5)}" text-anchor="${x < cx - 5 ? "end" : x > cx + 5 ? "start" : "middle"}">${steps[i]}</text>`).join("")}
    <text x="${cx}" y="${cy + 5}" text-anchor="middle">One governed loop</text></svg>`;
};

// A left-to-right row of numbered steps.
const flow = (steps) => {
  const w = 360 / steps.length;
  return `<svg class="ig" viewBox="0 0 360 220" role="img" aria-label="${steps.map((s) => s[0]).join(", then ")}">${arrowDefs}
    ${steps.map(([t, d], i) => { const x = i * w + w / 2; return `
      ${i < steps.length - 1 ? `<path class="ln" marker-end="url(#a)" d="M${x + 22} 70H${x + w - 24}"/>` : ""}
      <circle class="dot" cx="${x}" cy="70" r="17"/><text class="n" x="${x}" y="75" text-anchor="middle">${i + 1}</text>
      <text class="t" x="${x}" y="118" text-anchor="middle">${t}</text>
      ${d.map((l, k) => `<text x="${x}" y="${140 + k * 18}" text-anchor="middle">${l}</text>`).join("")}`; }).join("")}</svg>`;
};

const CUTS = [
  { v: "overview", title: "How it works", length: "59 s", who: "For everyone",
    text: "The loop from a customer request to a shipped release, and who acts at each step.",
    art: loop(["Request", "Triage", "Idea", "Roadmap", "Release"]) },
  { v: "customers", title: "For customer teams", length: "60 s", who: "For members and company admins",
    text: "Sign in, search before asking, submit a request and follow it to release.",
    art: flow([["Search", ["Check what", "exists"]], ["Submit", ["Describe the", "outcome"]], ["Follow", ["Know when", "it moves"]]]) },
  { v: "team", title: "For the DataCentral team", length: "63 s", who: "For contributors, product managers and admins",
    text: "The weekly rhythm: triage, shape ideas, publish and release, then communicate.",
    art: flow([["Triage", ["Decide the", "next step"]], ["Shape", ["Consolidate", "and score"]], ["Release", ["Publish", "safely"]], ["Tell", ["Email", "customers"]]]) },
];

const play = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>`;
document.getElementById("grid").innerHTML = CUTS.map((c) => `
  <article class="card">
    <figure>${c.art}</figure>
    <div class="in">
      <h2>${c.title}</h2>
      <div class="meta">${c.who} · ${c.length}</div>
      <p>${c.text}</p>
      <div class="actions">
        <button class="btn" type="button" data-open="${c.v}">${play}Watch here</button>
        <a class="link" href="player.html?v=${c.v}">player.html?v=${c.v}</a>
      </div>
    </div>
  </article>`).join("");

// The open cut lives in the hash, so the browser's own back button closes the viewer too.
const frame = document.getElementById("frame");
function sync() {
  const cut = CUTS.find((c) => c.v === location.hash.slice(1));
  document.body.classList.toggle("viewing", !!cut);
  document.getElementById("now").textContent = cut ? cut.title : "";
  const src = cut ? `player.html?v=${cut.v}` : "about:blank";
  if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
  if (cut) document.getElementById("back").focus();
}
document.getElementById("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]");
  if (b) location.hash = b.dataset.open;
});
document.getElementById("back").addEventListener("click", () => {
  history.replaceState(null, "", location.pathname + location.search);
  sync();
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("viewing")) document.getElementById("back").click(); });
addEventListener("hashchange", sync);
sync();
</script>
</body>
</html>
