<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse explainer</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/SpaceGrotesk-500.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/SpaceGrotesk-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("assets/IBMPlexSans-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("assets/IBMPlexSans-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("assets/IBMPlexSans-600.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 700; src: url("assets/IBMPlexSans-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/IBMPlexMono-400.woff2") format("woff2"); }

:root {
  --page: #fafafa; --card: #ffffff; --ink: #171717; --body: #404040; --muted: #737373;
  --border: #e5e5e5; --border-strong: #d4d4d4; --tint: #f5f5f5;
  --head: "Space Grotesk", sans-serif; --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--page); color: var(--ink); font-family: var(--sans); transform-origin: 0 0; overflow: hidden; }

/* persistent chrome */
.topbar { position: absolute; left: 96px; right: 96px; top: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.brand { display: flex; align-items: center; gap: 24px; }
.brand img { height: 46px; display: block; }
.brand .sep { width: 1px; height: 40px; background: var(--border-strong); }
.brand .prod { font-family: var(--head); font-weight: 500; font-size: 36px; color: var(--body); }
.cut { font-family: var(--sans); font-weight: 500; font-size: 28px; color: var(--muted); }
.progress { position: absolute; left: 0; bottom: 0; height: 8px; width: 100%; background: var(--border); z-index: 5; }
.progress i { display: block; height: 100%; width: 0; background: var(--ink); }

/* scenes */
.scene { position: absolute; inset: 0; padding: 190px 96px 80px; display: none; flex-direction: column; }
.eyebrow { font-family: var(--sans); font-weight: 700; font-size: 28px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
h1 { font-family: var(--head); font-weight: 700; font-size: 78px; line-height: 1.08; letter-spacing: -0.01em; max-width: 1560px; }
.sub { font-size: 40px; line-height: 1.3; color: var(--body); margin-top: 26px; max-width: 1500px; }
.body { flex: 1; display: flex; align-items: center; gap: 40px; padding-top: 30px; }
.body.top { align-items: flex-start; padding-top: 56px; }
.body.eq { flex: none; align-items: stretch; margin: auto 0; padding-top: 0; }
.eqrow { display: flex; gap: 40px; align-items: stretch; }

.scene.title { padding: 0 96px; justify-content: center; align-items: flex-start; }
.scene.title img { height: 78px; margin-bottom: 64px; }
.scene.title h1 { font-size: 132px; line-height: 1.02; max-width: 1640px; }
.scene.title .sub { font-size: 50px; margin-top: 40px; max-width: 1400px; }
.scene.title .url { font-family: var(--mono); font-size: 34px; color: var(--muted); margin-top: 64px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(23,23,23,.08); padding: 40px; }
.card.grow { flex: 1; }
.card h3 { font-family: var(--head); font-weight: 700; font-size: 46px; line-height: 1.12; letter-spacing: -0.01em; }
.card p { font-size: 34px; line-height: 1.32; color: var(--body); margin-top: 18px; }
.card .num { font-family: var(--head); font-weight: 700; font-size: 28px; color: var(--muted); margin-bottom: 18px; }
.card.on { background: var(--ink); border-color: var(--ink); }
.card.on h3, .card.on p { color: #fff; }
.card.on .num { color: #a3a3a3; }
.list { list-style: none; margin-top: 22px; }
.list li { font-size: 33px; line-height: 1.3; color: var(--body); padding: 14px 0 14px 34px; border-top: 1px solid var(--border); position: relative; }
.list li::before { content: ""; position: absolute; left: 2px; top: 30px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }

.id { font-family: var(--mono); font-size: 30px; color: var(--muted); }
.lbl { font-family: var(--sans); font-weight: 600; font-size: 30px; color: var(--muted); }
.ttl { font-family: var(--head); font-weight: 700; font-size: 46px; line-height: 1.15; letter-spacing: -0.01em; }
.meta { font-size: 30px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 14px; font-family: var(--sans); font-weight: 600; font-size: 30px; padding: 10px 26px 10px 20px; border-radius: 999px; white-space: nowrap; background: var(--tint); color: var(--body); }
.pill::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #a3a3a3; }
.pill.ok { background: #ecfdf5; color: #047857; } .pill.ok::before { background: #10b981; }
.pill.warn { background: #fffbeb; color: #b45309; } .pill.warn::before { background: #f59e0b; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px 36px; box-shadow: 0 2px 8px rgba(23,23,23,.06); }
.row .l { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row .t { font-family: var(--head); font-weight: 700; font-size: 40px; line-height: 1.15; }
.stack { display: flex; flex-direction: column; gap: 22px; }
.stack.grow { flex: 1; }
.chip { font-family: var(--head); font-weight: 500; font-size: 36px; padding: 24px 32px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--card); color: var(--ink); white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.field { border: 1px solid var(--border-strong); border-radius: 8px; padding: 22px 28px; font-size: 36px; min-height: 90px; background: #fff; display: flex; align-items: center; }
.label { font-size: 28px; font-weight: 600; color: var(--muted); margin: 26px 0 12px; }
.label:first-child { margin-top: 0; }
.caret::after { content: ""; display: inline-block; width: 3px; height: 1em; background: var(--ink); margin-left: 4px; vertical-align: -0.15em; }
.arrow { font-family: var(--mono); font-size: 72px; color: var(--border-strong); flex: none; }
.col { flex: 1; background: var(--tint); border: 1px solid var(--border); border-radius: 12px; padding: 32px; align-self: stretch; display: flex; flex-direction: column; gap: 20px; }
.col h3 { font-family: var(--head); font-weight: 700; font-size: 46px; }
.col .note { font-size: 30px; color: var(--muted); margin-top: -12px; margin-bottom: 8px; }
.item { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 24px 26px; box-shadow: 0 1px 2px rgba(23,23,23,.06); }
.item .t { font-family: var(--head); font-weight: 700; font-size: 34px; line-height: 1.18; margin-top: 8px; }
.item.ghost { height: 92px; box-shadow: none; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.item.ghost i { display: block; height: 14px; border-radius: 7px; background: var(--border); width: 70%; }
.item.ghost i + i { width: 42%; }
.bubble { background: var(--ink); color: #fff; border-radius: 12px; padding: 30px 38px; font-size: 40px; line-height: 1.3; min-height: 112px; display: flex; align-items: center; }
.bubble .caret::after { background: #fff; }
.guards { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
</style>
</head>
<body>
<div id="stage">
  <div class="topbar" id="topbar">
    <div class="brand"><img src="assets/datacentral-blacktext.svg" alt="DataCentral"><span class="sep"></span><span class="prod">Pulse</span></div>
    <div class="cut" id="cut"></div>
  </div>
  <div id="scenes"></div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script src="player.js"></script>
</body>
</html>
